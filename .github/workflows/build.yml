# Builds the mod and the installers for every platform.
# Download the results from the run's "Artifacts" section.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  mod:
    name: Mod + installer jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build
        run: ./gradlew build test :installer:fatJar --no-configuration-cache
      - uses: actions/upload-artifact@v7
        with:
          name: javahost-mod
          path: build/libs/javahost-*.jar
      - uses: actions/upload-artifact@v7
        with:
          name: javahost-installer-jar
          path: installer/build/dist/*.jar

  macos:
    name: macOS installer (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Build .dmg
        run: ./gradlew :installer:jpackageMac --no-configuration-cache
      - uses: actions/upload-artifact@v7
        with:
          name: javahost-installer-macos
          path: installer/build/jpackage/*.dmg

  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Install WiX (needed by jpackage for .exe)
        run: choco install wixtoolset -y --no-progress
      - name: Build .exe
        id: exe
        continue-on-error: true
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          ./gradlew :installer:jpackageWindows --no-configuration-cache
      - name: Build portable folder (fallback)
        if: steps.exe.outcome != 'success'
        shell: bash
        run: ./gradlew :installer:jpackageAppImage --no-configuration-cache
      - name: Zip portable folder
        if: steps.exe.outcome != 'success'
        shell: pwsh
        run: Compress-Archive -Path "installer/build/jpackage/JavaHost Installer" -DestinationPath "installer/build/jpackage/JavaHost-Installer-Windows-portable.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: javahost-installer-windows
          path: |
            installer/build/jpackage/*.exe
            installer/build/jpackage/*.zip

  # On a version tag (v1.5.0): publish a GitHub Release with a signed update.json, which JavaHost's
  # in-game updater reads. Run scripts/release.sh to tag a release.
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mod, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v7
        with:
          path: dist
      - name: Make the signed update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d' > notes.txt
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          API=$(grep '^fabric_api_version=' gradle.properties | cut -d= -f2)
          PROTOCOL=$(grep -o 'PROTOCOL = [0-9]*' src/main/java/com/javahost/JavaHost.java | grep -o '[0-9]*$')
          MINIMUM=$(grep '^minimum_version=' gradle.properties | cut -d= -f2)
          java scripts/MakeUpdateManifest.java dist/update "$VERSION" "$PROTOCOL" "$MC" "$API" "dist/javahost-mod/javahost-$VERSION.jar" notes.txt "$MINIMUM"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          shopt -s nullglob
          gh release create "$GITHUB_REF_NAME" --title "JavaHost $VERSION" --notes-file notes.txt \
            "dist/javahost-mod/javahost-$VERSION.jar" dist/update/update.json dist/update/update.json.sig \
            dist/javahost-installer-jar/*.jar dist/javahost-installer-macos/*.dmg \
            dist/javahost-installer-windows/*.exe dist/javahost-installer-windows/*.zip
