    <script>
      // Light or dark, before anything is drawn: ?theme= for this visit only, then the visitor's own choice, then the system.
      // The switch in the top bar flips it and remembers the choice. Storage may be blocked: then it just isn't remembered.
      (() => {
        const root = document.documentElement;
        const KEY = "javahost-theme";
        const COLOURS = { light: "#0a1024", dark: "#06080b" };
        const system = matchMedia("(prefers-color-scheme: dark)");
        const valid = (t) => (t === "dark" || t === "light" ? t : null);
        let forced = null;
        let saved = null;
        try {
          forced = valid(new URLSearchParams(location.search).get("theme"));
        } catch (e) {}
        try {
          saved = valid(localStorage.getItem(KEY));
        } catch (e) {}
        function label() {
          const dark = root.dataset.theme === "dark";
          document.querySelectorAll("[data-theme-switch]").forEach((b) => {
            b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
            b.title = dark ? "Light theme" : "Dark theme";
          });
        }
        function apply(theme) {
          root.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach((m) => m.setAttribute("content", COLOURS[theme]));
          label();
        }
        apply(forced || saved || (system.matches ? "dark" : "light"));
        root.classList.add("tt");
        // with no choice of their own, the page keeps following the system as it changes
        system.addEventListener?.("change", (e) => forced || saved || apply(e.matches ? "dark" : "light"));
        document.addEventListener("DOMContentLoaded", label);
        document.addEventListener("click", (e) => {
          if (!e.target.closest?.("[data-theme-switch]")) return;
          const next = root.dataset.theme === "dark" ? "light" : "dark";
          saved = next;
          try {
            localStorage.setItem(KEY, next);
          } catch (e) {}
          apply(next);
        });
      })();
    </script>
    <script>
      (() => {
        // Content waits for the page script to bring it in. If that script fails or never finishes, show everything.
        const root = document.documentElement;
        const giveUp = () => root.classList.contains("ok") || root.classList.remove("js", "pin");
        root.classList.add("js");
        addEventListener("error", giveUp);
        setTimeout(giveUp, 5000);
      })();
    </script>
    <style>
      /* gen:textures */
      /* /gen:textures */

      :root {
        --ink: #0a1024;
        --paper: #f3faff;
        --green: #3ddc84;
        --blue: #4f9df7;
        --purple: #a77bf3;
        --orange: #f59e3b;
        --pink: #f06baa;
        --a: var(--green);
        --display: "Silkscreen", "Pixelify Sans", ui-monospace, monospace;
        --pixel: "Pixelify Sans", ui-monospace, monospace;
        --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

        /* One spacing scale for the whole page. Nothing uses a gap that is not on it. */
        --s1: 8px;
        --s2: 16px;
        --s3: 24px;
        --s4: 32px;
        --s5: 48px;
        --s6: 64px;
        --s7: 96px;
        --s8: 128px;
        --s9: 160px;
        --pad: clamp(96px, 11vw, 168px); /* every section, top and bottom */
        --width: 1200px;
        --gutter: clamp(20px, 5vw, 64px);
        --nav: 64px;
        --measure: 34em; /* about 60 characters of body text */

        /* the page's colours, section by section: one day, from morning to night */
        --c-how: #f3faff;
        --c-host: #3ddc84;
        --c-friends: #2459c9;
        --c-voice: #6b46d6;
        --c-mods: #cf3a7f;
        --c-mods-hills: #8f1f56;
        --c-ping: #f59e3b;
        --c-ping-hills: #a8500f;
        --c-try: #3a2a8f;
        --c-try-hills: #22195e;
        --c-more: #1c1a52;
        --c-stats: #121338;
        --c-get: #0c0e28;
        --c-faq: #080a1c;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        scroll-padding-top: var(--nav);
      }
      body {
        margin: 0;
        background: var(--ink);
        color: #fff;
        font: 1.125rem/1.6 var(--body);
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      img {
        max-width: 100%;
        display: block;
      }
      a {
        color: inherit;
      }
      ::selection {
        background: var(--green);
        color: #04140b;
      }
      :focus-visible {
        outline: 4px solid var(--fg, #fff);
        outline-offset: 4px;
      }
      .wrap {
        width: min(var(--width), 100% - var(--gutter) * 2);
        margin-inline: auto;
        position: relative;
      }
      svg.i {
        width: 1.2em;
        height: 1.2em;
        fill: currentColor;
        flex: none;
        shape-rendering: crispEdges;
      }
      .art {
        /* pixel art drawn as vectors: keep the edges hard */
        shape-rendering: crispEdges;
        display: block;
        overflow: visible;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      /* ------------------------------------------------------------ type: three sizes per section. A display size, one
         size for everything you read (18px), and 22px for card titles. */
      h1,
      h2,
      .h2 {
        font-family: var(--display);
        font-weight: 700;
        text-transform: uppercase;
        line-height: 1.04;
        letter-spacing: -0.09em;
        margin: 0;
      }
      h1 {
        font-size: clamp(2.5rem, 6.2vw, 5.75rem);
      }
      h2,
      .h2 {
        font-size: clamp(2.25rem, 4vw, 3.5rem);
        text-shadow: 0.07em 0.07em 0 var(--deep);
      }
      h3 {
        font: 600 1.375rem/1.25 var(--pixel);
        margin: 0;
      }
      p {
        margin: 0;
        text-wrap: pretty;
      }
      /* the word that matters sits on a slab, like a block someone just placed */
      .a {
        display: inline-block;
        padding: 0.02em 0.2em 0.1em 0.14em;
        margin: 0.06em 0.1em 0.1em 0;
        background: var(--slab);
        color: var(--slab-ink);
        text-shadow: none;
        box-shadow:
          0 -4px 0 0 var(--slab),
          0 4px 0 0 var(--slab),
          -4px 0 0 0 var(--slab),
          4px 0 0 0 var(--slab),
          4px 8px 0 0 var(--deep),
          12px 8px 0 0 var(--deep),
          8px 4px 0 0 var(--deep),
          8px 12px 0 0 var(--deep);
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: var(--s2);
        font: 600 1.125rem/1 var(--pixel);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        margin: 0 0 var(--s2);
      }
      .eyebrow::before {
        content: "";
        width: 12px;
        height: 12px;
        background: currentColor;
        box-shadow: 16px 0 0 0 currentColor;
        margin-right: 16px;
      }
      /* headline, then the paragraph 24 below it, then whatever follows 32 below that */
      .lede {
        max-width: var(--measure);
        margin-top: var(--s3);
        color: var(--mut, inherit);
      }
      .lede + * {
        margin-top: var(--s4);
      }

      /* ------------------------------------------------------------ pixel edges: a stepped outline and a hard shadow, all box-shadow */
      .btn,
      .card,
      .route,
      .panel,
      .tile,
      .badge,
      details {
        --p: 4px;
        --so: 8px;
        --bd: var(--ink);
        --sh: var(--deep, rgba(0, 0, 0, 0.35));
        box-shadow:
          0 calc(var(--p) * -1) 0 0 var(--bd),
          0 var(--p) 0 0 var(--bd),
          calc(var(--p) * -1) 0 0 0 var(--bd),
          var(--p) 0 0 0 var(--bd),
          calc(var(--so) - var(--p)) var(--so) 0 0 var(--sh),
          calc(var(--so) + var(--p)) var(--so) 0 0 var(--sh),
          var(--so) calc(var(--so) - var(--p)) 0 0 var(--sh),
          var(--so) calc(var(--so) + var(--p)) 0 0 var(--sh);
      }

      /* ------------------------------------------------------------ buttons: chunky, lit from above, they press into their shadow */
      .btn {
        --fill: #fff;
        --so: 6px;
        --sh: var(--ink);
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 14px 24px 16px;
        font: 600 1.125rem var(--pixel);
        letter-spacing: 0.02em;
        text-decoration: none;
        color: var(--ink);
        background:
          linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)) 0 0 / 100% 4px no-repeat,
          linear-gradient(rgba(0, 0, 0, 0.16), rgba(0, 0, 0, 0.16)) 0 100% / 100% 6px no-repeat,
          var(--fill);
        border: 0;
        cursor: pointer;
        transition:
          transform 0.1s steps(2),
          box-shadow 0.1s steps(2);
      }
      .btn:hover {
        --so: 8px;
        transform: translate(-2px, -2px);
      }
      .btn:active {
        --so: 2px;
        transform: translate(4px, 4px);
      }
      .btn.primary {
        --fill: var(--green);
        color: #04140b;
      }
      .btn.small {
        --so: 4px;
        padding: 8px 16px 10px;
        font-size: 1rem;
      }
      .btn.small:hover {
        --so: 6px;
      }

      /* ------------------------------------------------------------ top bar */
      .nav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: var(--ink);
        box-shadow: 0 4px 0 rgba(4, 8, 24, 0.45);
      }
      .nav .wrap {
        display: flex;
        align-items: center;
        gap: var(--s4);
        height: var(--nav);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font: 700 1.2rem var(--display);
        letter-spacing: -0.06em;
        text-transform: uppercase;
        text-decoration: none;
        margin-right: auto;
        color: #fff;
      }
      .logo {
        width: 30px;
        height: 30px;
        color: var(--green);
      }
      .logo .ink {
        fill: #04140b;
      }
      .nav-links {
        display: flex;
        gap: var(--s4);
      }
      .nav-links a {
        position: relative;
        color: #aab6d3;
        text-decoration: none;
        font: 500 1rem var(--pixel);
      }
      .nav-links a::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -8px;
        height: 4px;
        background: var(--green);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.2s steps(4);
      }
      .nav-links a:hover {
        color: #fff;
      }
      .nav-links a:hover::after {
        transform: scaleX(1);
      }
      /* An experience bar that fills as you read down the page. */
      .xp {
        position: absolute;
        left: 0;
        right: 0;
        bottom: -4px;
        height: 4px;
        background: repeating-linear-gradient(90deg, var(--green) 0 20px, #1c9a57 20px 24px);
        transform: scaleX(0);
        transform-origin: left;
      }

      /* ------------------------------------------------------------ bands: every section has a colour of its own, and the
         one before it dissolves into it through three rows of dither */
      .band {
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        padding-block: var(--pad);
        --grid: rgba(255, 255, 255, 0.06);
        --slab: #fff;
        --slab-ink: var(--bg);
        --mut: var(--fg);
      }
      .band::before,
      .dither::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0;
        pointer-events: none;
        background:
          conic-gradient(transparent 25%, var(--prev) 0) 0 0 / 16px 16px repeat-x,
          repeating-conic-gradient(var(--prev) 0 25%, transparent 0 50%) 0 16px / 16px 16px repeat-x,
          conic-gradient(var(--prev) 25%, transparent 0) 0 32px / 16px 16px repeat-x,
          linear-gradient(var(--grid) 2px, transparent 2px) 0 62px / 100% 64px,
          linear-gradient(90deg, var(--grid) 2px, transparent 2px) calc(50% + 31px) 0 / 64px 100%;
      }
      .head {
        max-width: 760px;
        margin-bottom: var(--s6);
      }
      .decor {
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
      }
      .decor > * {
        position: absolute;
      }
      /* far things move less than near things while the page scrolls (the script sets --sy on each band) */
      [data-par] {
        transform: translate3d(0, calc(var(--sy, 0) * var(--par) * 1px), 0);
      }
      .cloud {
        color: #fff;
        height: auto;
      }
      .drift {
        animation: drift var(--t, 90s) linear infinite alternate;
      }
      @keyframes drift {
        to {
          translate: var(--dx, 80px) 0;
        }
      }
      .stars {
        inset: 0;
        background: var(--stars-a) 0 0 / 384px 384px;
        image-rendering: pixelated;
        opacity: var(--o, 1);
        /* bright out in the margins, barely there behind the words */
        --edge: calc(50% - min(var(--width), 100% - var(--gutter) * 2) / 2);
        -webkit-mask-image: linear-gradient(90deg, #000 calc(var(--edge) - 24px), rgba(0, 0, 0, 0.14) var(--edge), rgba(0, 0, 0, 0.14) calc(100% - var(--edge)), #000 calc(100% - var(--edge) + 24px));
        mask-image: linear-gradient(90deg, #000 calc(var(--edge) - 24px), rgba(0, 0, 0, 0.14) var(--edge), rgba(0, 0, 0, 0.14) calc(100% - var(--edge)), #000 calc(100% - var(--edge) + 24px));
      }
      .hills,
      .bank {
        left: 50%;
        bottom: -40px;
        display: flex;
        width: 4800px;
        margin-left: -2400px;
      }
      .hills .art,
      .bank .art {
        width: 2400px;
      }

      /* things come in as you reach them: one calm rise, nothing more */
      .js [data-reveal] {
        opacity: 0;
        transform: translateY(32px);
        transition:
          opacity 0.6s ease,
          transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        transition-delay: var(--d, 0s);
      }
      .js [data-reveal].in {
        opacity: 1;
        transform: none;
      }

      /* ------------------------------------------------------------ cubes: a little block that carries an icon */
      .cube {
        --s: 40px;
        --c: var(--a);
        position: relative;
        display: block;
        flex: none;
        width: var(--s);
        height: var(--s);
        transform-style: preserve-3d;
        transform: rotateX(-24deg) rotateY(-38deg);
      }
      .cube > i {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--c);
        color: #fff;
        box-shadow:
          inset calc(var(--s) / 14) calc(var(--s) / 14) 0 0 rgba(255, 255, 255, 0.28),
          inset calc(var(--s) / -14) calc(var(--s) / -14) 0 0 rgba(0, 0, 0, 0.2);
      }
      .cube > .t {
        transform: rotateX(90deg) translateZ(calc(var(--s) / 2));
        background: color-mix(in srgb, var(--c), #fff 28%);
      }
      .cube > .f {
        transform: translateZ(calc(var(--s) / 2));
      }
      .cube > .r {
        transform: rotateY(90deg) translateZ(calc(var(--s) / 2));
        background: color-mix(in srgb, var(--c), #000 30%);
      }
      .cube svg {
        width: 58%;
        height: 58%;
        fill: currentColor;
        shape-rendering: crispEdges;
      }
