    <script>
      (() => {
        const html = document.documentElement;
        const $ = (s, root = document) => root.querySelector(s);
        const $$ = (s, root = document) => [...root.querySelectorAll(s)];
        const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const watching = "IntersectionObserver" in window;
        const params = new URLSearchParams(location.search);
        const clamp = (n, low, high) => Math.max(low, Math.min(high, n));
        const RELEASES = "https://github.com/IbrahimMas1/javahost/releases/latest";

        // Each part of the page is set up on its own, so one failing never takes the others with it.
        function part(name, setup) {
          try {
            setup();
          } catch (problem) {
            console.warn("JavaHost page: " + name + " is off.", problem);
          }
        }
        // Tells `changed` whether an element is on screen, so its animation can rest while it isn't.
        function watch(el, changed, margin) {
          if (!el) return;
          if (!watching) return changed(true);
          new IntersectionObserver((entries) => changed(entries[entries.length - 1].isIntersecting), { rootMargin: margin || "0px" }).observe(el);
        }
        // Work that follows the scroll, done at most once per frame.
        const onScroll = [];
        let lastY = scrollY;
        let scrollDir = 1;
        let scrollQueued = false;
        function scrolled() {
          scrollQueued = false;
          const moved = scrollY - lastY;
          lastY = scrollY;
          if (moved) scrollDir = moved > 0 ? 1 : -1;
          for (const task of onScroll) task();
        }
        function queueScroll() {
          if (scrollQueued) return;
          scrollQueued = true;
          requestAnimationFrame(scrolled);
        }
        addEventListener("scroll", queueScroll, { passive: true });
        addEventListener("resize", queueScroll);
        function make(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text != null) node.textContent = text;
          return node;
        }
        const OWN = new Set(["copy", "star", "mic-off"]);
        const iconHref = (name) => (OWN.has(name) ? "#" : "media/icons.svg#") + name;
        function icon(name) {
          const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
          const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
          svg.setAttribute("class", "i");
          svg.setAttribute("aria-hidden", "true");
          use.setAttribute("href", iconHref(name));
          svg.append(use);
          return svg;
        }
        // Play a one-shot CSS animation again from the start.
        function again(el, name) {
          if (calm || !el) return;
          el.classList.remove(name);
          void el.offsetWidth;
          el.classList.add(name);
        }

        // ---------------------------------------------------------------- the island
        // A small voxel world drawn with CSS 3D. Blocks live in a map; only the faces the camera can ever see are made
        // (top, front and right: the island never turns far enough to show the others), and neighbours in a row share
        // one element, so the whole thing is a few hundred flat rectangles. Sizes are in "u" (see .stage in the styles).
        function buildIsland(root) {
          const B = 12; // one block
          const round = (n) => Math.round(n * 100) / 100;
          const u = (n) => (n ? "calc(var(--u)*" + round(n) + ")" : "0px");
          const out = document.createDocumentFragment();
          const billboards = [];
          const blocks = new Map();
          const key = (x, y, z) => x + "," + y + "," + z;
          const put = (x, y, z, what) => blocks.set(key(x, y, z), what);
          const at = (x, y, z) => blocks.get(key(x, y, z));
          // water is see-through at the edges: it only hides the side of more water
          const hides = (what, neighbour) => neighbour !== undefined && (neighbour !== "water" || what === "water");
          // block coordinates to places: x left to right, z back to front, y up (so its top is further up the page)
          const X = (x) => (x - 4.5) * B;
          const Z = (z) => (z - 4.5) * B;
          const top = (y) => -(y + 1) * B;
          const when = (y, z) => Math.round((y + 6) * 80 + z * 14); // the order things are built in: bottom up, back to front

          // One flat rectangle. kind is t (lying flat, seen from above), f (facing the front) or r (facing right).
          // x, y, z is its top-left corner; a right face runs from that corner toward the back.
          function face(kind, look, x, y, z, w, h, delay, more) {
            const el = document.createElement("div");
            el.className = "vf " + kind + " " + look;
            el.style.cssText =
              "width:" + u(w) + ";height:" + u(h) + ";transform:translate3d(" + u(x) + "," + u(y) + "," + u(z) + ")" +
              (kind === "t" ? " rotateX(90deg)" : kind === "r" ? " rotateY(90deg)" : "") + ";animation-delay:" + (delay || 0) + "ms" +
              (more && more.c ? ";--c:" + more.c : "");
            ((more && more.into) || out).append(el);
            return el;
          }
          // A box smaller (or larger) than a block: x and z are the middle of its base, y is the ground it stands on.
          function box(look, x, y, z, w, h, d, delay, more) {
            face("t", look, x - w / 2, y - h, z - d / 2, w, d, delay, more);
            face("f", look, x - w / 2, y - h, z + d / 2, w, h, delay, more);
            face("r", look, x + w / 2, y - h, z + d / 2, d, h, delay, more);
          }
          // A point in the world that other things hang from.
          function pin(x, y, z, kind, into) {
            const el = document.createElement("div");
            el.className = "grp" + (kind ? " " + kind : "");
            el.style.transform = "translate3d(" + u(x) + "," + u(y) + "," + u(z) + ")";
            (into || out).append(el);
            return el;
          }

          // The land, seen from above (back row first): 1 grass, 2 a hill, p path, w water. And how deep it hangs below.
          const LAND = [".22211111", "222211111", "122211111", "112111p11", "1111ppp11", "1111p1ww1", ".11111ww1", ".111111w.", "..1111..."];
          const DEEP = [".12232211", "112343221", "123454321", "123465432", "123455432", "122345321", ".12344321", ".1123322.", "..1122..."];
          LAND.forEach((row, z) =>
            [...row].forEach((kind, x) => {
              if (kind === ".") return;
              for (let y = -DEEP[z][x]; y < 0; y++) put(x, y, z, y === -1 ? "dirt" : y <= -4 ? "deep" : "stone");
              put(x, 0, z, kind === "w" ? "water" : kind === "p" ? "sand" : kind === "2" ? "dirt" : "grass");
              if (kind === "2") put(x, 1, z, "grass");
            }),
          );
          // gems in the rock, in JavaHost's colours
          [[4, -3, 7, "ore-g"], [2, -2, 6, "ore-g"], [6, -3, 6, "ore-p"], [8, -2, 3, "ore-b"], [7, -3, 4, "ore-g"], [5, -4, 6, "ore-b"], [3, -4, 6, "ore-p"]].forEach(
            ([x, y, z, what]) => at(x, y, z) && put(x, y, z, what),
          );
          // the house: plank walls, a stepped roof
          for (let x = 5; x <= 7; x++)
            for (let z = 0; z <= 2; z++) {
              put(x, 1, z, "plank");
              put(x, 2, z, "plank");
              put(x, 3, z, "roof");
              if (z === 1) put(x, 4, z, "roof");
            }
          // the tree, in blossom
          put(2, 2, 1, "log");
          put(2, 3, 1, "log");
          for (let x = 1; x <= 3; x++)
            for (let z = 0; z <= 2; z++) {
              put(x, 4, z, "leaf");
              if (x === 2 || z === 1) put(x, 5, z, "leaf");
            }
          put(2, 6, 1, "leaf");
          put(0, 4, 1, "leaf");
          put(2, 4, 3, "leaf");

          // Blocks to faces. A face is made only where nothing covers it, and a run of the same block becomes one element.
          for (let y = -7; y <= 7; y++) {
            for (let z = 0; z < 9; z++) {
              for (const kind of ["t", "f"]) {
                let x = 0;
                while (x < 9) {
                  const what = at(x, y, z);
                  const open = (xx) => at(xx, y, z) === what && !hides(what, kind === "t" ? at(xx, y + 1, z) : at(xx, y, z + 1));
                  if (what === undefined || !open(x)) {
                    x++;
                    continue;
                  }
                  let run = 1;
                  while (x + run < 9 && open(x + run)) run++;
                  const low = what === "water" ? 2 : 0;
                  if (kind === "t") face("t", "m-" + what, X(x), top(y) + low, Z(z), run * B, B, when(y, z));
                  else face("f", "m-" + what, X(x), top(y) + low, Z(z) + B, run * B, B - low, when(y, z));
                  x += run;
                }
              }
            }
            for (let x = 0; x < 9; x++) {
              let z = 8;
              while (z >= 0) {
                const what = at(x, y, z);
                const open = (zz) => at(x, y, zz) === what && !hides(what, at(x + 1, y, zz));
                if (what === undefined || !open(z)) {
                  z--;
                  continue;
                }
                let run = 1;
                while (z - run >= 0 && open(z - run)) run++;
                const low = what === "water" ? 2 : 0;
                face("r", "m-" + what, X(x) + B, top(y) + low, Z(z) + B, run * B, B - low, when(y, z));
                z -= run;
              }
            }
          }
          const ground = top(0);
          const late = when(3, 4);

          // the door and windows
          face("f", "flat", X(6) + 3, ground - 11, Z(3) + 0.2, 6, 11, late, { c: "#5a3a26" });
          face("f", "flat", X(6) + 7, ground - 6, Z(3) + 0.4, 1, 1, late, { c: "#ffe45c" });
          face("f", "flat win", X(5) + 3, ground - 19, Z(3) + 0.2, 6, 6, late, { c: "#ffe58a" });
          face("f", "flat win", X(7) + 3, ground - 19, Z(3) + 0.2, 6, 6, late, { c: "#ffe58a" });
          face("r", "flat win", X(8) + 0.2, ground - 19, Z(1) + 9, 6, 6, late, { c: "#ffe58a" });
          // the chimney, and its smoke
          box("flat", X(5) + 5, top(3), Z(0) + 6, 5, 9, 5, late + 80, { c: "#7d889d" });
          const smoke = pin(X(5) + 5, top(3) - 9, Z(0) + 6);
          const puffs = document.createElement("div");
          puffs.className = "bb";
          puffs.innerHTML = '<i class="puff"></i><i class="puff" style="--dl:-1.2s"></i><i class="puff" style="--dl:-2.4s"></i>';
          smoke.append(puffs);
          billboards.push(puffs);
          // the tree's shadow on the hill
          face("t", "flat", X(1), top(1) - 0.2, Z(1), 3 * B, 2 * B, late, { c: "rgba(13,34,92,.16)" });
          // the campfire: a ring of stones, two logs, and a flame with two frames
          const fx = X(3.0);
          const fz = Z(5.3);
          [[-5, 0], [5, 0], [0, -5], [0, 5], [-4, 4], [4, -4]].forEach(([dx, dz]) => box("flat", fx + dx, ground, fz + dz, 3, 2, 3, late, { c: "#7d889d" }));
          box("flat", fx, ground, fz, 9, 2, 2, late, { c: "#7c5437" });
          box("flat", fx, ground, fz, 2, 2.4, 9, late, { c: "#986a43" });
          box("flat frame-a", fx, ground - 2, fz, 5, 6, 5, late, { c: "#ff8a2e" });
          box("flat frame-a", fx - 0.5, ground - 2, fz + 0.1, 3, 10, 3, late, { c: "#ffe45c" });
          box("flat frame-b", fx, ground - 2, fz, 4, 8, 4, late, { c: "#ff8a2e" });
          box("flat frame-b", fx + 1, ground - 2, fz + 0.1, 3, 11, 3, late, { c: "#ffe45c" });
          // flowers
          [[0.6, 3.4, "#fff"], [1.5, 5.6, "#ffe45c"], [0.4, 5.3, "#f06baa"], [2.4, 7.4, "#fff"], [5.4, 7.5, "#ffe45c"], [8.5, 4.4, "#f06baa"], [8.4, 6.3, "#fff"], [4.6, 3.3, "#f06baa"]].forEach(
            ([x, z, colour]) => {
              box("flat", X(x), ground, Z(z), 1, 3, 1, late + 120, { c: "#2fb267" });
              box("flat", X(x), ground - 3, Z(z), 3, 2, 3, late + 120, { c: colour });
            },
          );
          // the flag
          box("flat", X(0.5), ground, Z(4.5), 2, 42, 2, late, { c: "#e9eeff" });
          const mast = pin(X(0.5) + 1, ground - 42, Z(4.5));
          mast.innerHTML = '<div class="flag"><svg aria-hidden="true"><use href="#jh"/></svg></div>';
          // the pond pours off the corner
          for (const kind of ["f", "r"]) {
            const fall = kind === "f" ? face("f", "fall f", X(7), ground + 2, Z(8) + 0.4, B, 70, late) : face("r", "fall r", X(8) + 0.4, ground + 2, Z(8), B, 70, late);
            fall.append(document.createElement("i"));
          }
          // two little islands keeping it company, and clouds at its feet
          const near = pin(-110, -25, -40, "sat");
          box("m-grass", 0, 12, 0, 12, 12, 12, late + 200, { into: near });
          box("m-dirt", 0, 18, 0, 7, 6, 7, late + 200, { into: near });
          box("flat", -2, 0, 1, 3, 2, 3, late + 260, { into: near, c: "#ffe45c" });
          const low = pin(40, 72, 48, "puffy");
          box("flat puffc", 0, 0, 0, 52, 6, 26, late + 320, { into: low, c: "#fff" });
          box("flat puffc", -5, -6, -2, 32, 5, 17, late + 320, { into: low, c: "#fff" });
          box("flat puffc", 2, -11, -3, 15, 4, 10, late + 320, { into: low, c: "#fff" });

          // the players stand on it
          root.querySelectorAll(".player[data-at]").forEach((el) => {
            const [x, z] = el.dataset.at.split(",").map(Number);
            el.style.transform = "translate3d(" + u(X(x) - 8) + "," + u(ground - 32) + "," + u(Z(z)) + ")";
            billboards.push(el.querySelector(".tag"));
          });
          root.prepend(out);
          return { billboards: billboards.filter(Boolean) };
        }

        const stage = $("#stage");
        const island = $("#island");
        let world = null;
        let yaw = -36; // how far the island is turned, and tipped toward us
        let pitch = -27;
        try {
          world = buildIsland(island);
          if (!calm) {
            island.classList.add("building");
            setTimeout(() => island.classList.remove("building"), 4200);
          }
        } catch (error) {
          stage.classList.add("plain");
        }

        // ---------------------------------------------------------------- things come in as you reach them
        part("reveal", () => {
          const arriving = $$("[data-reveal]");
          $$("#hero [data-reveal]").forEach((el) => el.classList.add("in"));
          if (watching && !calm) {
            const seen = new IntersectionObserver(
              (entries) => {
                for (const entry of entries) {
                  if (entry.isIntersecting) {
                    entry.target.classList.add("in");
                    seen.unobserve(entry.target);
                  }
                }
              },
              { rootMargin: "0px 0px -8% 0px", threshold: 0.08 },
            );
            arriving.forEach((el) => seen.observe(el));
          } else {
            arriving.forEach((el) => el.classList.add("in"));
          }
        });

        // ---------------------------------------------------------------- the experience bar, and depth
        // Each scene's backdrop gets --sy, how far the scene's middle is from the middle of the screen (in hundreds of
        // pixels). Its layers multiply that by their own depth, so far things lag behind near ones.
        part("depth", () => {
          const xp = $("#xp");
          const live = new Set();
          if (watching && !calm) {
            const near = new IntersectionObserver((entries) => entries.forEach((entry) => (entry.isIntersecting ? live.add(entry.target) : live.delete(entry.target))), {
              rootMargin: "15% 0px",
            });
            $$("[data-scene]").forEach((el) => near.observe(el));
          }
          onScroll.push(() => {
            const room = html.scrollHeight - innerHeight;
            xp.style.transform = "scaleX(" + (room > 0 ? Math.min(1, scrollY / room) : 0) + ")";
            const middle = innerHeight / 2;
            const moves = [];
            for (const el of live) {
              const box = el.getBoundingClientRect();
              moves.push([el.querySelector(".decor"), ((box.top + box.height / 2 - middle) / 100).toFixed(2)]);
            }
            for (const [backdrop, sy] of moves) if (backdrop) backdrop.style.setProperty("--sy", sy);
          });
          queueScroll();
        });

        // ---------------------------------------------------------------- the players
        // Each is six boxes (head, body, arms, legs) whose faces show the right patch of a 64x64 skin, placed in 3D with
        // CSS. Sizes are in "u", one skin pixel, so the whole figure scales with one variable.
        const BOXES = [
          // name, x, y, width, height, depth, then where each face is on the skin: top, bottom, right, front, left, back
          ["head", 4, 0, 8, 8, 8, [8, 0, 16, 0, 0, 8, 8, 8, 16, 8, 24, 8]],
          ["torso", 4, 8, 8, 12, 4, [20, 16, 28, 16, 16, 20, 20, 20, 28, 20, 32, 20]],
          ["armR", 0, 8, 4, 12, 4, [44, 16, 48, 16, 40, 20, 44, 20, 48, 20, 52, 20]],
          ["armL", 12, 8, 4, 12, 4, [36, 48, 40, 48, 32, 52, 36, 52, 40, 52, 44, 52]],
          ["legR", 4, 20, 4, 12, 4, [4, 16, 8, 16, 0, 20, 4, 20, 8, 20, 12, 20]],
          ["legL", 8, 20, 4, 12, 4, [20, 48, 24, 48, 16, 52, 20, 52, 24, 52, 28, 52]],
        ];
        const u = (n) => "calc(var(--u) * " + n + ")";
        const cast = {}; // the ones with a part to play in the demo, by name
        const players = $$(".player").map((el) => {
          el.style.setProperty("--skin", "url(" + el.dataset.skin + ")");
          const turn = make("div", "turn");
          const sway = make("div", "sway");
          turn.append(sway);
          el.append(turn);
          for (const [name, x, y, w, h, d, at] of BOXES) {
            const piece = make("div", "part " + name);
            piece.style.cssText = "left:" + u(x) + ";top:" + u(y) + ";width:" + u(w) + ";height:" + u(h);
            const faces = [
              // width, height, skin x, skin y, where it goes, how brightly it's lit
              [w, d, at[0], at[1], "rotateX(90deg) translateZ(" + u(h / 2) + ")", 1.12],
              [w, d, at[2], at[3], "rotateX(-90deg) translateZ(" + u(h / 2) + ")", 0.5],
              [d, h, at[4], at[5], "rotateY(-90deg) translateZ(" + u(w / 2) + ")", 0.78],
              [w, h, at[6], at[7], "translateZ(" + u(d / 2) + ")", 1],
              [d, h, at[8], at[9], "rotateY(90deg) translateZ(" + u(w / 2) + ")", 0.78],
              [w, h, at[10], at[11], "rotateY(180deg) translateZ(" + u(d / 2) + ")", 0.6],
            ];
            for (const [fw, fh, sx, sy, transform, light] of faces) {
              const face = make("div", "face");
              face.style.cssText =
                "width:" + u(fw) + ";height:" + u(fh) + ";left:" + u((w - fw) / 2) + ";top:" + u((h - fh) / 2) +
                ";background-position:" + u(-sx) + " " + u(-sy) + ";transform:" + transform + ";filter:brightness(" + light + ")";
              piece.append(face);
            }
            sway.append(piece);
          }
          // In the demo a name tag shows who is talking, or that you are muted.
          const label = $(".tag b", el);
          if (label && el.dataset.who) {
            const bars = make("span", "bars");
            bars.append(make("i"), make("i"), make("i"));
            const off = icon("mic-off");
            off.classList.add("off");
            label.append(bars, off);
          }
          const home = parseFloat(el.style.getPropertyValue("--turn")) || 24;
          const player = { el, home, turn: home, hy: 0, hx: 0, head: $(".head", el), onIsland: !!island && island.contains(el), seen: !watching, busy: false, timer: 0 };
          if (el.dataset.who) cast[el.dataset.who] = player;
          watch(el, (on) => (player.seen = on));
          if (!("nodrag" in el.dataset)) {
            // Drag to turn them round.
            let dragFrom = null;
            el.addEventListener("pointerdown", (event) => {
              dragFrom = { x: event.clientX, turn: player.turn };
              el.setPointerCapture(event.pointerId);
              event.stopPropagation();
            });
            el.addEventListener("pointermove", (event) => {
              if (dragFrom) turnTo(player, dragFrom.turn + (event.clientX - dragFrom.x) * 0.7);
            });
            const drop = () => (dragFrom = null);
            el.addEventListener("pointerup", drop);
            el.addEventListener("pointercancel", drop);
            el.addEventListener("click", () => wave(player));
          }
          return player;
        });
        function turnTo(player, degrees, smoothly) {
          player.turn = degrees;
          if (smoothly && !calm) {
            player.el.classList.add("turning");
            setTimeout(() => player.el.classList.remove("turning"), 500);
          }
          player.el.style.setProperty("--turn", degrees.toFixed(1) + "deg");
        }
        function wave(player) {
          if (calm || !player || player.el.classList.contains("waving") || player.el.classList.contains("sitting")) return;
          player.el.classList.add("waving");
          setTimeout(() => player.el.classList.remove("waving"), 2300);
        }
        if (!calm && players.length) {
          // Their heads follow the mouse, easing toward it. The loop runs only while a head still has somewhere to go.
          let mouseX = -1;
          let mouseY = -1;
          let looking = false;
          function look() {
            let moving = false;
            for (const player of players) {
              if (!player.seen || !player.head) continue;
              const box = player.el.getBoundingClientRect();
              const dx = mouseX - (box.left + box.width / 2);
              const dy = mouseY - (box.top + box.height * 0.15);
              const facing = player.turn + (player.onIsland ? yaw : 0);
              const body = ((facing % 360) + 540) % 360 - 180; // which way the body faces, -180..180
              const wantY = clamp(dx * 0.11 - body, -55, 55);
              const wantX = clamp(-dy * 0.07, -28, 28);
              if (Math.abs(wantY - player.hy) < 0.3 && Math.abs(wantX - player.hx) < 0.3) continue;
              player.hy += (wantY - player.hy) * 0.14;
              player.hx += (wantX - player.hx) * 0.14;
              player.head.style.setProperty("--hy", player.hy.toFixed(1) + "deg");
              player.head.style.setProperty("--hx", player.hx.toFixed(1) + "deg");
              moving = true;
            }
            if (moving) requestAnimationFrame(look);
            else looking = false;
          }
          addEventListener(
            "mousemove",
            (event) => {
              mouseX = event.clientX;
              mouseY = event.clientY;
              if (looking) return;
              looking = true;
              requestAnimationFrame(look);
            },
            { passive: true },
          );
          // AlexPlays waves once, after landing on the island.
          setTimeout(() => wave(players.find((p) => p.onIsland && p.el.classList.contains("friend"))), 3200);
        }

        // ---------------------------------------------------------------- the island turns: slowly by itself, toward the mouse, and when dragged
        if (world && !calm) {
          let mx = 0;
          let my = 0;
          let pull = 0;
          let grab = null;
          let onScreen = true;
          addEventListener(
            "mousemove",
            (event) => {
              mx = event.clientX / innerWidth - 0.5;
              my = event.clientY / innerHeight - 0.5;
            },
            { passive: true },
          );
          island.addEventListener("pointerdown", (event) => {
            grab = { x: event.clientX, pull };
            island.setPointerCapture(event.pointerId);
          });
          island.addEventListener("pointermove", (event) => {
            if (grab) pull = clamp(grab.pull + (event.clientX - grab.x) * 0.25, -22, 22);
          });
          const release = () => (grab = null);
          island.addEventListener("pointerup", release);
          island.addEventListener("pointercancel", release);
          watch(stage, (on) => (onScreen = on));
          (function turn(now) {
            if (onScreen && !document.hidden) {
              const wantYaw = clamp(-36 + Math.sin(now / 3600) * 4 + mx * 16 + pull, -62, -10);
              const wantPitch = -27 - my * 6;
              yaw += (wantYaw - yaw) * 0.08;
              pitch += (wantPitch - pitch) * 0.08;
              island.style.transform = "rotateX(" + pitch.toFixed(2) + "deg) rotateY(" + yaw.toFixed(2) + "deg)";
              const undo = "rotateY(" + (-yaw).toFixed(2) + "deg) rotateX(" + (-pitch).toFixed(2) + "deg)";
              for (const el of world.billboards) el.style.transform = undo;
            }
            requestAnimationFrame(turn);
          })(0);
        }

        // ---------------------------------------------------------------- the story: one pinned window, four features, the sky changing behind it
        let showStep = () => {};
        part("story", () => {
          const story = $("#features");
          const chapters = $$(".chapter", story);
          if (!story || !chapters.length || calm || !watching) return;
          const wide = matchMedia("(min-width: 981px)");
          const shots = $$(".gw-shot", story);
          const callouts = $$(".gw-callout", story);
          const nodes = $$(".rail a", story);
          const fill = $("#rail-fill");
          const big = $("#pin-big");
          const scan = $("#gw-scan");
          let active = 0;
          let near = false;
          let tidy = 0;
          const setPin = () => html.classList.toggle("pin", wide.matches);
          setPin();
          wide.addEventListener?.("change", () => {
            setPin();
            queueScroll();
          });
          showStep = (index, way, instant) => {
            if (index === active) return;
            const before = active;
            active = index;
            const chapter = chapters[index];
            story.dataset.step = chapter.dataset.key;
            chapters.forEach((el, i) => el.classList.toggle("on", i === index));
            nodes.forEach((el, i) => {
              el.classList.toggle("on", i === index);
              el.classList.toggle("done", i < index);
            });
            callouts.forEach((el) => el.classList.toggle("on", el.dataset.key === chapter.dataset.key));
            shots.forEach((el, i) => {
              el.classList.remove("wipe-up", "wipe-down");
              el.classList.toggle("on", i === index);
              el.classList.toggle("was", i === before && !instant);
            });
            big.textContent = "0" + (index + 1);
            $("#pin-tab").textContent = chapter.dataset.tab;
            scan.classList.remove("up", "down");
            big.classList.remove("flip");
            if (instant) return;
            void scan.offsetWidth; // so the animations start again
            shots[index].classList.add(way > 0 ? "wipe-up" : "wipe-down");
            scan.classList.add(way > 0 ? "up" : "down");
            big.classList.add("flip");
            clearTimeout(tidy);
            tidy = setTimeout(() => shots.forEach((el) => el.classList.remove("was")), 700);
          };
          chapters[0].classList.add("on");
          nodes[0].classList.add("on");
          watch(story, (visible) => (near = visible), "20% 0px");
          onScroll.push(() => {
            if (!near || !wide.matches) return;
            const middle = innerHeight * 0.52;
            const centres = chapters.map((chapter) => {
              const box = chapter.getBoundingClientRect();
              return (box.top + box.bottom) / 2;
            });
            let best = 0;
            centres.forEach((centre, i) => {
              if (Math.abs(centre - middle) < Math.abs(centres[best] - middle)) best = i;
            });
            const last = centres.length - 1;
            fill.style.setProperty("--p", clamp((middle - centres[0]) / (centres[last] - centres[0] || 1), 0, 1).toFixed(3));
            showStep(best, scrollDir);
          });
          // The window turns a little toward the mouse.
          const pin = $("#pin-in");
          if (matchMedia("(pointer: fine)").matches) {
            let queued = false;
            let x = 0;
            let y = 0;
            addEventListener(
              "mousemove",
              (event) => {
                x = event.clientX / innerWidth - 0.5;
                y = event.clientY / innerHeight - 0.5;
                if (queued || !near) return;
                queued = true;
                requestAnimationFrame(() => {
                  queued = false;
                  pin.style.setProperty("--ry", (x * 6).toFixed(2) + "deg");
                  pin.style.setProperty("--rx", (-y * 4).toFixed(2) + "deg");
                });
              },
              { passive: true },
            );
          }
        });

        // ---------------------------------------------------------------- the ping picture: packets rest while it is off screen, and stand still for anyone who asked for no motion
        part("route", () => {
          const drawing = $("#route-art");
          if (!drawing || !drawing.pauseAnimations) return;
          if (calm) {
            drawing.setCurrentTime(0.5);
            drawing.pauseAnimations();
          } else {
            watch(drawing, (on) => (on ? drawing.unpauseAnimations() : drawing.pauseAnimations()));
          }
        });

        // ---------------------------------------------------------------- the demo: a miniature of the menu that keeps its own little state
        // Everything here is pretend. Nothing is sent, the microphone is never opened and the clipboard is left alone.
        const demo = $("#demo");
        part("demo", () => {
          if (!demo) return;
          const tryStage = $("#try-stage");
          const FRIENDS = [
            { id: "alex", name: "AlexPlays", idle: "Online" },
            { id: "luna", name: "LunaBuilds", idle: "Playing" },
            { id: "mossy", name: "MossyMiner", idle: "Online" },
          ];
          const SKINS = { you: "media/skin-host.png", alex: "media/skin-friend.png", luna: "media/skin-luna.png", mossy: "media/skin-mossy.png" };
          const MODS = { lanterns: "Example Lanterns", biomes: "Example Biomes", critters: "Example Critters" };
          const fresh = () => ({
            tab: "home",
            hosting: false,
            code: "",
            copied: false,
            voice: false,
            muted: false,
            party: false,
            talk: "ptt",
            limit: 8,
            friendsOnly: true,
            who: { alex: "idle", luna: "idle", mossy: "idle" }, // idle, joining or here
            star: {},
            mods: {}, // installing or installed
            view: "discover",
            ticket: {}, // which invite is the latest, per friend, so a stale timer from an earlier one does nothing
          });
          let S = fresh();
          const here = () => FRIENDS.filter((friend) => S.who[friend.id] === "here");
          const coming = () => FRIENDS.filter((friend) => S.who[friend.id] !== "idle");
          const bind = {};
          const timers = new Set();
          const talking = new Set();
          let feed = [];
          let stageSeen = false;
          watch(tryStage, (on) => (stageSeen = on));
          // Later, or straight away for someone who has asked for no motion.
          function wait(fn, ms) {
            if (calm) return fn();
            const timer = setTimeout(() => {
              timers.delete(timer);
              fn();
            }, ms);
            timers.add(timer);
          }
          // What just happened, for screen readers. The menu itself shows it by changing.
          function note(text) {
            if (bind.said) bind.said.textContent = text;
          }
          function log(id, who, text, good) {
            feed.unshift({ id, who, text, good, fresh: true });
            feed.length = Math.min(feed.length, 3);
          }
          function newCode() {
            const letters = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
            const chunk = () => Array.from({ length: 5 }, () => letters[Math.floor(Math.random() * letters.length)]).join("");
            return "JH-" + chunk() + "-" + chunk();
          }
          function goTab(tab) {
            const activeEl = document.activeElement;
            const page = activeEl && demo.contains(activeEl) && activeEl.closest(".mm-page");
            S.tab = tab;
            // Keep the keyboard's place if the button just pressed is about to be hidden with its page.
            if (page && page.dataset.page !== tab) $('.mm-nav[data-tab="' + tab + '"]', demo)?.focus({ preventScroll: true });
          }
          // Friends walk in along the top of the menu when they join, and out again when hosting stops.
          const spots = {};
          $$(".try-spot[data-friend]").forEach((spot) => (spots[spot.dataset.friend] = spot));
          function walk(id, arriving) {
            const spot = spots[id];
            const player = cast[id];
            if (!spot || !player) return;
            spot.classList.toggle("here", arriving);
            if (calm) return;
            player.busy = true;
            player.el.classList.add("walking");
            turnTo(player, arriving ? -80 : 80, !arriving);
            clearTimeout(player.timer);
            player.timer = setTimeout(() => {
              player.busy = false;
              player.el.classList.remove("walking");
              turnTo(player, player.home, arriving);
              if (arriving) wave(player);
            }, 1500);
          }
          function setHosting(on) {
            if (on === S.hosting) return;
            S.hosting = on;
            if (on) {
              S.ask = "";
              S.code = newCode();
              note("Hosting New World. Friends can join now.");
              log("you", "You", "started hosting New World", true);
              wave(cast.you);
            } else {
              for (const friend of coming()) {
                if (spots[friend.id]?.classList.contains("here")) walk(friend.id, false);
                S.who[friend.id] = "idle";
              }
              S.code = "";
              talking.clear();
              note("Hosting stopped.");
              log("you", "You", "stopped hosting");
            }
          }
          function invite(id) {
            const friend = FRIENDS.find((f) => f.id === id);
            if (!friend || S.who[id] !== "idle") return;
            if (!S.hosting) {
              // nothing to invite them to yet: say so in the menu's own header
              S.ask = friend.name;
              note("Start hosting first, then invite " + friend.name + ".");
              return;
            }
            if (1 + coming().length >= S.limit) return note("Your world is full.");
            S.who[id] = "joining";
            const ticket = (S.ticket[id] = (S.ticket[id] || 0) + 1);
            const current = () => S.who[id] === "joining" && S.ticket[id] === ticket;
            note("Invite sent to " + friend.name + ".");
            log(id, friend.name, "was invited");
            wait(() => current() && walk(id, true), 500);
            wait(() => current() && arrive(id), 2000);
          }
          function arrive(id) {
            const friend = FRIENDS.find((f) => f.id === id);
            if (S.who[id] !== "joining") return;
            S.who[id] = "here";
            note(friend.name + " joined, connected directly.");
            log(id, friend.name, "joined New World", true);
            if (S.voice) tickTalk();
            render();
          }
          function inviteAll() {
            if (!S.hosting) {
              S.ask = "everyone";
              return note("Start hosting first, then invite everyone.");
            }
            const idle = FRIENDS.filter((friend) => S.who[friend.id] === "idle");
            idle.forEach((friend, index) =>
              wait(() => {
                invite(friend.id);
                render();
              }, index * 420),
            );
          }
          function setVoice(on) {
            S.voice = on;
            note(on ? "Voice chat on. In this demo your real microphone stays off." : "Voice chat off.");
            if (on) tickTalk();
            else talking.clear();
          }
          function setLimit(limit) {
            if (limit < 1 + coming().length) return note("There are " + (1 + coming().length) + " of you. Pick a limit that fits everyone.");
            S.limit = limit;
          }
          function copyCode() {
            if (!S.hosting) return note("No code yet. It appears when you host.");
            S.copied = true;
            note("Invite code copied. In this demo your clipboard is untouched.");
            wait(() => {
              S.copied = false;
              render();
            }, 1600);
          }
          function install(id) {
            if (S.mods[id]) return;
            S.mods[id] = "installing";
            const button = $('[data-act="install"][data-mod="' + id + '"]', demo);
            if (button && !calm) button.append(make("span", "fill"));
            wait(() => {
              if (S.mods[id] !== "installing") return;
              S.mods[id] = "installed";
              note(MODS[id] + " installed. A friend who joins gets it too.");
              render();
            }, 1200);
          }
          function reset() {
            timers.forEach(clearTimeout);
            timers.clear();
            for (const friend of FRIENDS) {
              if (spots[friend.id]?.classList.contains("here")) walk(friend.id, false);
            }
            talking.clear();
            S = fresh();
            feed = FRIENDS.map((friend) => ({ id: friend.id, who: friend.name, text: "came online" })).reverse();
            $$(".fill", demo).forEach((fill) => fill.remove());
            note("The demo is back to the start.");
          }
          // Who is talking changes every second and a half while voice is on.
          function tickTalk() {
            talking.clear();
            if (!S.voice) return;
            const able = ["you", ...here().map((friend) => friend.id)].filter((id) => !(id === "you" && S.muted));
            if (calm) able.forEach((id) => talking.add(id));
            else if (able.length) {
              talking.add(able[Math.floor(Math.random() * able.length)]);
              if (able.length > 2 && Math.random() < 0.35) talking.add(able[Math.floor(Math.random() * able.length)]);
            }
            paintTalk();
          }
          function paintTalk() {
            for (const id in SKINS) {
              const on = talking.has(id);
              cast[id]?.el.classList.toggle("talking", on);
              $('.mm-talk [data-who="' + id + '"]', demo)?.classList.toggle("talking", on);
            }
            cast.you?.el.classList.toggle("muted", S.voice && S.muted);
          }
          function setButton(button, name, label) {
            if (!button) return;
            const use = $("use", button);
            const text = $("span:not(.fill)", button);
            if (use && name) use.setAttribute("href", iconHref(name));
            if (text) text.textContent = label;
          }
          const pressed = (selector, test) => $$(selector, demo).forEach((button) => button.setAttribute("aria-pressed", String(test(button))));
          // Draw the whole menu from the state. Every action changes the state, then calls this.
          function render() {
            const friendsHere = here();
            const total = 1 + friendsHere.length;
            $$(".mm-nav", demo).forEach((button) => (button.dataset.tab === S.tab ? button.setAttribute("aria-current", "page") : button.removeAttribute("aria-current")));
            $$(".mm-page", demo).forEach((page) => page.classList.toggle("on", page.dataset.page === S.tab));
            const homeLine = !S.hosting
              ? S.ask
                ? "Start hosting first, then invite " + S.ask + "."
                : "Host your world, then invite a friend."
              : friendsHere.length
                ? "Playing with " + friendsHere.length + (friendsHere.length === 1 ? " friend." : " friends.")
                : "You're hosting. Invite a friend to get started.";
            const heads = {
              home: ["Good to see you", homeLine],
              friends: ["Friends", !S.hosting && S.ask ? "Start hosting first, then invite " + S.ask + "." : "3 online. Invite them to your world."],
              host: ["Host a world", S.hosting ? "New World is open to your friends." : "Pick one: it opens and hosting starts."],
              voice: ["Voice chat", "Talk nearby, or to the whole world."],
              mods: ["Mods", "Find mods, then play them with friends."],
            };
            bind.title.textContent = heads[S.tab][0];
            bind.sub.textContent = heads[S.tab][1];
            bind.me.textContent = S.hosting ? "Hosting" : "Online";

            const main = $('[data-act="main"]', demo);
            setButton(main, S.hosting ? "users" : "wifi", S.hosting ? "Invite friends" : "Start hosting");
            bind.pill.classList.toggle("on", S.hosting);
            bind.pill.lastElementChild.textContent = S.hosting ? "Hosting" : "Not hosting";

            const host = $('[data-act="host"]', demo);
            setButton(host, S.hosting ? "close" : "wifi", S.hosting ? "Stop hosting" : "Start hosting");
            host.classList.toggle("go", !S.hosting);
            host.classList.toggle("stop", S.hosting);
            bind.world.textContent = S.hosting ? total + " of " + S.limit + " players" : "Only you, for now";
            bind.codebox.classList.toggle("on", S.hosting);
            bind.code.textContent = S.hosting ? S.code : "appears when you host";
            setButton($('[data-act="copy"]', demo), S.copied ? "check" : "copy", S.copied ? "Copied" : "Copy");

            for (const friend of FRIENDS) {
              const state = S.who[friend.id];
              for (const row of $$('[data-row="' + friend.id + '"]', demo)) {
                row.classList.toggle("joining", state === "joining");
                row.classList.toggle("here", state === "here");
                $("small", row).textContent = state === "joining" ? "Joining…" : state === "here" ? "Playing with you" : friend.idle;
                const button = $('[data-act="invite"]', row);
                setButton(button, state === "here" ? "check" : state === "joining" ? "reload" : "play", state === "here" ? "In world" : state === "joining" ? "Sent" : "Invite");
                button.classList.toggle("go", state === "idle");
                button.classList.toggle("wait", state === "joining");
                button.classList.toggle("quiet", state === "here");
                button.setAttribute("aria-disabled", String(state !== "idle"));
              }
            }
            pressed('[data-act="star"]', (button) => !!S.star[button.dataset.friend]);
            pressed('[data-act="limit"]', (button) => +button.dataset.limit === S.limit);
            pressed('[data-act="talk"]', (button) => button.dataset.talk === S.talk);
            pressed('[data-act="reach"]', (button) => (button.dataset.reach === "party") === S.party);
            pressed('[data-act="modview"]', (button) => button.dataset.view === S.view);
            $('[data-act="friends-only"]', demo).setAttribute("aria-checked", String(S.friendsOnly));
            $('[data-act="voice"]', demo).setAttribute("aria-checked", String(S.voice));
            $('[data-act="mute"]', demo).setAttribute("aria-checked", String(S.muted));

            bind["chip-voice"].textContent = !S.voice ? "Off" : S.muted ? "Muted" : "On";
            bind["chip-players"].textContent = total + "/" + S.limit;
            bind["chip-route"].textContent = friendsHere.length ? "Direct" : "–";

            bind.feed.replaceChildren(
              ...feed.map((item) => {
                const line = make("li", item.fresh ? "new" : "");
                const avatar = make("span", "av xs");
                avatar.style.setProperty("--skin", "url(" + SKINS[item.id] + ")");
                const words = make("span", "t" + (item.good ? " good" : ""));
                words.append(make("b", "", item.who), " " + item.text);
                line.append(avatar, words, make("time", "", "just now"));
                item.fresh = false;
                return line;
              }),
            );
            bind.talkers.replaceChildren(
              ...[{ id: "you", name: "You" }, ...friendsHere].map((person) => {
                const line = make("li");
                line.dataset.who = person.id;
                const avatar = make("span", "av xs");
                avatar.style.setProperty("--skin", "url(" + SKINS[person.id] + ")");
                const bars = make("span", "bars");
                bars.append(make("i"), make("i"), make("i"));
                line.append(avatar, person.name, bars);
                const aside = !S.voice ? "voice off" : person.id === "you" && S.muted ? "muted" : "";
                if (aside) line.append(make("small", "", aside));
                return line;
              }),
            );
            let shown = 0;
            for (const row of $$("[data-mod].mm-row", demo)) {
              const state = S.mods[row.dataset.mod];
              const button = $("button", row);
              row.hidden = S.view === "installed" && state !== "installed";
              if (!row.hidden) shown++;
              setButton(button, "", state === "installed" ? "Installed" : state === "installing" ? "Installing…" : "Install");
              button.classList.toggle("go", state !== "installed");
              button.classList.toggle("quiet", state === "installed");
              button.setAttribute("aria-disabled", String(!!state));
              if (state === "installed") $(".fill", button)?.remove();
            }
            bind["mods-empty"].hidden = shown > 0;
            paintTalk();
          }
          $$("[data-bind]", demo).forEach((el) => (bind[el.dataset.bind] = el));
          feed = FRIENDS.map((friend) => ({ id: friend.id, who: friend.name, text: "came online" })).reverse();
          demo.addEventListener("click", (event) => {
            const button = event.target.closest("[data-act]");
            if (!button || !demo.contains(button)) return;
            const d = button.dataset;
            switch (d.act) {
              case "tab": goTab(d.tab); break;
              case "main": if (S.hosting) goTab("friends"); else setHosting(true); break;
              case "host": setHosting(!S.hosting); break;
              case "invite": invite(d.friend); break;
              case "invite-all": inviteAll(); break;
              case "star": S.star[d.friend] = !S.star[d.friend]; break;
              case "copy": copyCode(); break;
              case "friends-only": S.friendsOnly = !S.friendsOnly; break;
              case "limit": setLimit(+d.limit); break;
              case "voice": setVoice(!S.voice); break;
              case "mute": S.muted = !S.muted; tickTalk(); break;
              case "talk": S.talk = d.talk; break;
              case "reach": S.party = d.reach === "party"; break;
              case "modview": S.view = d.view; break;
              case "install": install(d.mod); break;
              case "reset": reset(); break;
            }
            render();
          });
          setInterval(() => S.voice && !calm && stageSeen && !document.hidden && (tickTalk(), 0), 1500);
          render();

          // For looking at the demo in a given state: ?demo=hosting, ?demo=invited, ?demo=voice, ?demo=party, ?tab=friends.
          // These only press the same buttons a visitor would.
          const press = (selector) => $(selector, demo)?.click();
          const state = params.get("demo") || "";
          if (/^(hosting|invited|voice|party)$/.test(state)) press('[data-act="main"]');
          if (/^(invited|voice|party)$/.test(state)) press('[data-act="invite"][data-friend="alex"]');
          if (state === "party") {
            press('[data-act="invite"][data-friend="luna"]');
            press('[data-act="invite"][data-friend="mossy"]');
          }
          if (state === "voice") {
            press('[data-act="tab"][data-tab="voice"]');
            press('[data-act="voice"]');
          }
          if (/^(home|friends|host|voice|mods)$/.test(params.get("tab") || "")) press('.mm-nav[data-tab="' + params.get("tab") + '"]');
        });

        // ---------------------------------------------------------------- the numbers spin once, then land
        part("numbers", () => {
          if (calm || !watching) return;
          const once = new IntersectionObserver(
            (entries) => {
              if (!entries.some((entry) => entry.isIntersecting)) return;
              once.disconnect();
              $$("[data-count]").forEach((el, index) => {
                const target = el.dataset.count;
                const prefix = el.dataset.prefix || "";
                let turns = 0;
                const spin = setInterval(() => {
                  turns++;
                  el.textContent = prefix + (turns < 10 + index * 3 ? Math.floor(Math.random() * 9 + 1) : target);
                  if (turns >= 10 + index * 3) clearInterval(spin);
                }, 55);
              });
            },
            { threshold: 0.4 },
          );
          once.observe($("#stats"));
        });

        // ---------------------------------------------------------------- downloads
        const os = {
          win: { name: "Windows", file: /\.exe$/i, url: null, step: "Run the <strong>JavaHost Installer .exe</strong>. If SmartScreen appears, choose <strong>More info → Run anyway</strong>." },
          mac: { name: "Mac", file: /\.dmg$/i, url: null, step: "Open the <strong>JavaHost Installer .dmg</strong> and run the installer. If macOS warns you, right-click it and choose <strong>Open</strong>." },
          linux: { name: "Linux", file: /Installer.*\.jar$/i, url: null, step: "Run the installer: <code>java -jar JavaHost-Installer.jar</code> (it needs Java 21 or newer)." },
        };
        const osTabs = $$("[data-os]");
        let current = "win";
        function pickOs(key) {
          current = key;
          osTabs.forEach((button) => {
            const on = button.dataset.os === key;
            button.setAttribute("aria-selected", String(on));
            button.tabIndex = on ? 0 : -1;
          });
          $("#run-step").innerHTML = os[key].step;
          $$("[data-download]").forEach((link) => (link.href = os[key].url || RELEASES));
          $$("[data-download-label]").forEach((label) => (label.textContent = "Download for " + os[key].name));
        }
        osTabs.forEach((button, index) => {
          button.addEventListener("click", () => pickOs(button.dataset.os));
          button.addEventListener("keydown", (event) => {
            const step = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
            if (step) {
              const next = osTabs[(index + step + osTabs.length) % osTabs.length];
              pickOs(next.dataset.os);
              next.focus();
            }
          });
        });
        const platform = navigator.userAgentData?.platform || navigator.platform || navigator.userAgent;
        pickOs(/Mac|iPhone|iPad/i.test(platform) ? "mac" : /Linux|X11/i.test(platform) && !/Android/i.test(navigator.userAgent) ? "linux" : "win");

        // The newest release's installers and version number, when GitHub answers. The buttons work without it.
        fetch("https://api.github.com/repos/IbrahimMas1/javahost/releases/latest")
          .then((response) => (response.ok ? response.json() : Promise.reject()))
          .then((release) => {
            const tag = String(release.tag_name || "").replace(/^v/, "");
            if (/^[\d.]+$/.test(tag)) $("#version").textContent = "JavaHost " + tag;
            for (const asset of release.assets || []) {
              for (const key in os) {
                if (os[key].file.test(asset.name) && /^https:\/\/github\.com\//.test(asset.browser_download_url)) os[key].url = asset.browser_download_url;
              }
            }
            pickOs(current);
          })
          .catch(() => {});

        // ---------------------------------------------------------------- for looking at a part of the page: ?at=try, ?step=2
        // The page jumps there by itself (no smooth scroll), and the story shows that step without its wipe.
        part("hooks", () => {
          if (params.has("measure")) setTimeout(() => (html.dataset.h = html.scrollHeight), 1500);
          if (["step", "at", "demo", "tab", "still"].some((key) => params.has(key))) {
            html.classList.add("still");
            $$("[data-reveal]").forEach((el) => el.classList.add("in"));
          }
          const step = +params.get("step");
          const at = params.get("at");
          if (!(step >= 1 && step <= 4) && !at) return;
          const go = () => {
            html.style.scrollBehavior = "auto";
            if (step >= 1 && step <= 4) {
              const chapter = $$(".chapter")[step - 1];
              const box = chapter.getBoundingClientRect();
              scrollTo(0, scrollY + box.top + box.height / 2 - innerHeight * 0.52);
              showStep(step - 1, 1, true);
            } else {
              const target = document.getElementById(at);
              if (target) scrollTo(0, scrollY + target.getBoundingClientRect().top - (+params.get("off") || 0));
            }
            queueScroll();
          };
          go();
          setTimeout(go, 300);
        });

        html.classList.add("ok");
      })();
    </script>
  </body>
</html>
