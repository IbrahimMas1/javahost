plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	// Only used by the automated tests (relay, shaders).
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"javahost" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Automated in-game tests: ./gradlew runClientGameTest launches the real client and a dedicated server.
	configureTests {
		createSourceSet = true
		modId = "javahost-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

configurations {
	testRelay
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Pure-Java Opus codec for voice chat, bundled inside the mod jar.
	implementation "io.github.jaredmdobson:concentus:${project.concentus_version}"
	include "io.github.jaredmdobson:concentus:${project.concentus_version}"

	testImplementation "org.junit.jupiter:junit-jupiter:5.14.3"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Real mods loaded only in the in-game tests, to test the relay and shader sharing for real.
	// e4mc 6.2.3 crashes 26.3 *dedicated* servers (it calls a removed permission method), and the single-client
	// test uses one, so the relay mod is only added to the two multiplayer test games (see below).
	testRelay "maven.modrinth:e4mc:${project.test_e4mc_version}"
	gametestRuntimeOnly "maven.modrinth:sodium:${project.test_sodium_version}"
	gametestRuntimeOnly "maven.modrinth:iris:${project.test_iris_version}"
}

// Optional: test alongside other mods, e.g. ./gradlew runClientGameTest -PextraMods=/path/to/folder
if (project.hasProperty("extraMods")) {
	loom.runs.getByName("clientGameTest").vmArg("-Dfabric.addMods=" + project.property("extraMods"))
}

// Two real game clients for the multiplayer test: one hosts its world, the other joins it.
// Run both at once:  ./gradlew runMpHost runMpGuest
def mpShared = file("build/run/mp-shared").absolutePath
[["mpHost", "Host"], ["mpGuest", "Guest"]].each { entry ->
	def (runName, user) = entry
	loom.runs.create(runName) {
		inherit loom.runs.getByName("clientGameTest")
		name = "Multiplayer test (${user})"
		runDir = "build/run/${runName}"
		vmArg "-Djavahost.testRole=${user.toLowerCase()}"
		vmArg "-Djavahost.mpDir=${mpShared}"
		vmArg "-Dfabric.addMods=${configurations.testRelay.singleFile.absolutePath}"
		// Test accounts are offline, so friend requests can't carry Mojang signatures in this test.
		vmArg "-Djavahost.insecureFriends=true"
		vmArg "-Djavahost.friendsNamespace=${project.findProperty("mpns") ?: "local"}"
		programArgs "--username", user
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

test {
	useJUnitPlatform()
}
